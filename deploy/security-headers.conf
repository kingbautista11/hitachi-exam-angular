# nginx snippet — include inside the server { } block that serves the built
# dist/hitachi-exam-angular/browser directory. Mirrors deploy/_headers.
#
#   server {
#     root /var/www/hitachi-exam-angular/browser;
#     index index.html;
#     include /etc/nginx/snippets/security-headers.conf;
#     location / { try_files $uri $uri/ /index.html; }   # SPA fallback
#   }

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://indexcodex.com; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

